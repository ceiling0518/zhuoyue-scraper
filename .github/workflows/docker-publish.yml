name: docker-publish

# 打 tag（v*）时自动构建并推送多架构镜像：linux/amd64 + linux/arm64
# 手动触发：Actions 页面 → Run workflow
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推 ghcr.io 需要

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # 只有配置了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 两个 secret 才会执行
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image list
        id: imgs
        env:
          HUBUSER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          imgs="ghcr.io/${{ github.repository_owner }}/zhuoyue-scraper"
          if [ -n "$HUBUSER" ]; then
            imgs="$imgs
          $HUBUSER/zhuoyue-scraper"
          fi
          {
            echo 'images<<EOF'
            echo "$imgs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgs.outputs.images }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
